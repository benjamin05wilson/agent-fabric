global:
  scrape_interval: 5s
scrape_configs:
  - job_name: agent-fabric
    static_configs:
      - targets: [api:8000, scheduler:9101, outbox:9103, otel-collector:9464]
  - job_name: gateways
    static_configs:
      - targets:
          - grpc-0:9102
          - grpc-1:9102
          - grpc-2:9102
          - grpc-3:9102
          - grpc-4:9102
          - grpc-5:9102
          - grpc-6:9102
          - grpc-7:9102

