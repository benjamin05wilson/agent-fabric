global:
  scrape_interval: 5s
scrape_configs:
  - job_name: agent-fabric
    static_configs:
      - targets: [api:8000, outbox:9103, otel-collector:9464]
  - job_name: schedulers
    static_configs:
      - targets:
          - scheduler:9101
          - scheduler-1:9101
          - scheduler-2:9101
          - scheduler-3:9101
          - scheduler-4:9101
          - scheduler-5:9101
          - scheduler-6:9101
          - scheduler-7:9101
  - job_name: gateways
    static_configs:
      - targets:
          - grpc-0:9102
          - grpc-1:9102
          - grpc-2:9102
          - grpc-3:9102
          - grpc-4:9102
          - grpc-5:9102
          - grpc-6:9102
          - grpc-7:9102

