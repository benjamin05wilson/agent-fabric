name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --locked --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff format --check control-plane tests migrations
      - run: ruff check control-plane tests migrations
      - run: mypy control-plane/agent_fabric
      - run: pytest --cov=agent_fabric --cov-report=term-missing

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/envs/dev validate -no-color

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.47.2
      - run: buf lint
      - run: buf generate && python scripts/fix_generated.py
      - run: git diff --exit-code -- control-plane/agent_fabric/generated worker/gen
      # Compare against the already fetched main branch.
      - run: buf breaking --against '.git#ref=refs/remotes/origin/main' || test "${{ github.ref_name }}" = main
      - run: docker compose config --quiet
      - run: docker compose build api grpc outbox scheduler worker loadgen


  tiny-demo-and-durable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python scripts/demo.py --prepare --output benchmarks/results/preparation
      - run: python scripts/demo.py --regressions --output benchmarks/results/tiny-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-fabric-tiny-demo-${{ github.sha }}
          path: benchmarks/results/
          if-no-files-found: error
