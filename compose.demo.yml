# Deliberately independent of the scale/real-worker stack. No host ports are published.
x-environment: &environment
  DATABASE_URL: postgresql+asyncpg://agent_fabric:agent_fabric@postgres:5432/agent_fabric
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: agent_fabric
  MINIO_SECRET_KEY: agent_fabric_dev_only
  API_KEY: af_dev_key
  GATEWAY_ID: demo
  PROJECT_MAX_RUNNING: "2"
x-control: &control
  image: agent-fabric-demo-control:local
  build:
    context: .
    dockerfile: control-plane/Dockerfile
    target: runtime
  environment: *environment
  depends_on:
    api: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_fabric
      POSTGRES_PASSWORD: agent_fabric
      POSTGRES_DB: agent_fabric
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agent_fabric]
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: agent_fabric
      MINIO_ROOT_PASSWORD: agent_fabric_dev_only
  api:
    <<: *control
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1s
      timeout: 2s
      retries: 30
  grpc:
    <<: *control
    entrypoint: [agent-fabric-grpc]
  scheduler:
    <<: *control
    entrypoint: [agent-fabric-scheduler]
  outbox:
    <<: *control
    entrypoint: [agent-fabric-outbox]
  demo:
    <<: *control
    profiles: [tools]
    entrypoint: [agent-fabric-loadgen]
    command: [--control, grpc:50051, --api, http://api:8000, --workers, "2", --jobs, "8", --seed, "42", --min-duration-ms, "50", --max-duration-ms, "100", --submit-concurrency, "2", --register-timeout, "20", --duration, "30", --deadline, "60", --require-success]
  regressions:
    <<: *control
    image: agent-fabric-demo-tests:local
    profiles: [tools]
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      target: test
    environment:
      <<: *environment
      AF_SERVICE_TESTS: "1"
    entrypoint: [python, -m, pytest, -q, tests/integration]
