name: agent-fabric

x-control-environment: &control-environment
  DATABASE_URL: postgresql+asyncpg://agent_fabric:agent_fabric@postgres:5432/agent_fabric
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: agent_fabric
  MINIO_SECRET_KEY: agent_fabric_dev_only
  MINIO_BUCKET: run-logs
  API_KEY: ${API_KEY:-af_dev_key}
  API_KEY_PROJECT: ${API_KEY_PROJECT:-local}
  PROJECT_MAX_QUEUED: ${PROJECT_MAX_QUEUED:-1000}
  PROJECT_MAX_RUNNING: ${PROJECT_MAX_RUNNING:-20}
  SCHEDULER_MAX_OUTSTANDING_OFFERS: ${SCHEDULER_MAX_OUTSTANDING_OFFERS:-100}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_fabric
      POSTGRES_PASSWORD: agent_fabric
      POSTGRES_DB: agent_fabric
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agent_fabric]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: agent_fabric
      MINIO_ROOT_PASSWORD: agent_fabric_dev_only
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - 9001:9001
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      target: runtime
    environment: *control-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - 8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  grpc:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      target: runtime
    entrypoint: [agent-fabric-grpc]
    environment:
      <<: *control-environment
      METRICS_PORT: "9102"
    depends_on:
      api: {condition: service_healthy}
    ports:
      - 50051:50051

  outbox:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      target: runtime
    entrypoint: [agent-fabric-outbox]
    environment:
      <<: *control-environment
      METRICS_PORT: "9103"
    depends_on:
      api: {condition: service_healthy}

  scheduler:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
      target: runtime
    entrypoint: [agent-fabric-scheduler]
    environment:
      <<: *control-environment
      METRICS_PORT: "9101"
    depends_on:
      api: {condition: service_healthy}

  loadgen:
    profiles: [load]
    build:
      context: .
      dockerfile: loadgen/Dockerfile
    command: [--control, grpc:50051, --api, http://api:8000, --workers, "100", --duration, "60"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_fabric:agent_fabric@postgres:5432/agent_fabric
    volumes:
      - ./benchmarks/results:/results
    depends_on:
      grpc: {condition: service_started}

  worker:
    profiles: [gvisor]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      CONTROL_PLANE_GRPC: grpc:50051
      WORKER_ID: local-gvisor-1
      WORKSPACE_ROOT: /var/lib/agent-fabric/workspaces
      WORKER_GPU_COUNT: ${WORKER_GPU_COUNT:-0}
      WORKER_VRAM_MB: ${WORKER_VRAM_MB:-0}
      WORKER_CAPABILITIES: ${WORKER_CAPABILITIES:-network-disabled}
    depends_on:
      grpc: {condition: service_started}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-workspaces:/var/lib/agent-fabric/workspaces

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  minio-data:
  worker-workspaces:
  tempo-data:
  grafana-data:
