global
  log stdout format raw local0
  maxconn 200000
  stats socket /tmp/haproxy-admin.sock mode 660 level admin

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend grpc_workers
  bind :50051
  maxconn 100000
  default_backend gateway_shards

backend gateway_shards
  balance roundrobin
  option tcp-check
  server shard0 grpc-0:50051 check
  server shard1 grpc-1:50051 check
  server shard2 grpc-2:50051 check
  server shard3 grpc-3:50051 check
  server shard4 grpc-4:50051 check
  server shard5 grpc-5:50051 check
  server shard6 grpc-6:50051 check
  server shard7 grpc-7:50051 check
