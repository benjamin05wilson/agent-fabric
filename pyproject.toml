[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fabric"
version = "0.1.0"
description = "A sandboxed, lease-based agent execution control plane"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "grpcio>=1.66,<2",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-grpc>=0.48b0,<1",
  "opentelemetry-instrumentation-redis>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2,<4",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "asyncpg-stubs>=0.29,<1",
  "grpcio-tools>=1.66,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-grpcio>=1.0,<2",
  "types-protobuf>=5,<7",
]

[project.scripts]
agent-fabric-api = "agent_fabric.api:run"
agent-fabric-scheduler = "agent_fabric.scheduler:run"
agent-fabric-grpc = "agent_fabric.grpc_server:run"
agent-fabric-outbox = "agent_fabric.outbox:run"
agent-fabric-loadgen = "agent_fabric.loadgen:run"

[tool.hatch.build.targets.wheel]
packages = ["control-plane/agent_fabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["control-plane/agent_fabric/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_fabric"]
mypy_path = "control-plane"
exclude = "control-plane/agent_fabric/generated"

[[tool.mypy.overrides]]
module = ["agent_fabric.generated.*"]
ignore_errors = true
